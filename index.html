<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컴코샘 컴퓨터 기초</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800;900&display=swap">
<style>
/* 레이아웃: 위쪽 과정 탭, 왼쪽 차시 목록, 오른쪽 활동 카드. 활동은 큰 창(패널)에서 진행 */
:root{
  --bg:#f2f5f4; --card:#ffffff; --ink:#1c2925; --muted:#5b6c66; --line:#d6dfdb; --soft:#e8efec;
  --c:#6b52c4; --c-ink:#ffffff; --c-soft:#ece7fa;
  --ok:#1f8a5b; --bad:#c2503a; --gold:#e6a817;
  --dev:#3d4b55; --dev2:#56656f; --devl:#d4dde2; --screen:#bfe3f3; --desk:#dcc095; --desk2:#c7a46f; --wall:#eef3f6; --paper:#ffffff;
  --display:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --body:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a18; --card:#1b2421; --ink:#e6eeea; --muted:#9aaca5; --line:#2e3b36; --soft:#222d29;
  --c-ink:#0e1714; --ok:#45b884; --bad:#e2775f; --gold:#f0bf45;
  --dev:#4c5c67; --dev2:#66767f; --devl:#a9b6bd; --screen:#5d8fa6; --desk:#7a6447; --desk2:#685338; --wall:#1d2629; --paper:#e9eef0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a18; --card:#1b2421; --ink:#e6eeea; --muted:#9aaca5; --line:#2e3b36; --soft:#222d29;
  --c-ink:#0e1714; --ok:#45b884; --bad:#e2775f; --gold:#f0bf45;
  --dev:#4c5c67; --dev2:#66767f; --devl:#a9b6bd; --screen:#5d8fa6; --desk:#7a6447; --desk2:#685338; --wall:#1d2629; --paper:#e9eef0; color-scheme:dark}
[data-course="intro"]{--c:#6b52c4;--c-soft:#ece7fa}
[data-course="win"]{--c:#1f6fd1;--c-soft:#e1ecfb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [data-course="intro"]{--c:#9a85ea;--c-soft:#2a2540} :root:not([data-theme="light"]) [data-course="win"]{--c:#5c9cf0;--c-soft:#1d2a3d}}
:root[data-theme="dark"] [data-course="intro"]{--c:#9a85ea;--c-soft:#2a2540} :root[data-theme="dark"] [data-course="win"]{--c:#5c9cf0;--c-soft:#1d2a3d}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
em{font-style:normal;color:var(--c);font-weight:800}
kbd{font-family:var(--body);font-size:.82em;font-weight:800;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;background:var(--card);color:var(--ink);white-space:nowrap}
[hidden]{display:none!important}
.primary{background:var(--c);color:var(--c-ink);border:1px solid var(--c);border-radius:12px;padding:10px 18px;font-size:1rem;font-weight:800}
.primary:hover{filter:brightness(1.07)}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:1rem;font-weight:800}
button:disabled{opacity:.4;cursor:default;filter:none}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:none;opacity:1}}

/* ---- 머리 ---- */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{font-family:var(--display);font-size:1.6rem;line-height:1}
.brand-en{font-family:var(--body);font-weight:800;color:var(--c);letter-spacing:.01em;margin-right:4px}
.brand small{display:block;font-family:var(--body);font-size:.75rem;color:var(--muted);margin-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:800;font-size:.98rem;display:flex;align-items:center;gap:6px}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--c);color:var(--c-ink);border-color:var(--c)}
.tab[aria-selected="true"] i{background:var(--c-ink)}

/* ---- 본문 ---- */
.app{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
@media (max-width:820px){.app{grid-template-columns:1fr}}
.app>*{min-width:0}
.list{display:flex;flex-direction:column;gap:6px}
.list-h{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:2px 4px 6px}
.li{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.li .no{font-family:var(--display);font-size:1.02rem;color:var(--c);text-align:center;background:var(--c-soft);border-radius:8px;padding:2px 0}
.li .tt{font-weight:600;font-size:.95rem;line-height:1.35}
.li .st{font-size:.8rem;color:var(--muted);white-space:nowrap}
.li .st.done{color:var(--ok);font-weight:800}
.li[aria-current="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c-soft)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.d-eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--c)}
.d-title{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.25;margin:4px 0 8px;text-wrap:balance}
.d-goal{color:var(--muted);margin:0 0 16px;max-width:42em}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.fact{background:var(--soft);border-radius:10px;padding:6px 12px;font-size:.88rem}
.fact b{font-weight:800}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:6px}
.act{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:160px}
.act:hover{border-color:var(--c)}
.act-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.act-ic{font-size:2rem;line-height:1}
.act-no{font-size:.75rem;font-weight:800;color:var(--muted)}
.act-n{font-family:var(--display);font-size:1.25rem;line-height:1.3}
.act-d{font-size:.88rem;color:var(--muted);flex:1}
.stars{color:var(--line);letter-spacing:2px;font-size:1.05rem}
.stars b{color:var(--gold);font-weight:400}
.act-k{display:inline-block;font-size:.72rem;font-weight:800;color:var(--c);background:var(--c-soft);border-radius:6px;padding:1px 7px}
.li.locked{opacity:.55}
.li.locked .no{background:var(--soft);color:var(--muted)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act-lock{font-size:.8rem;font-weight:800;color:var(--muted)}
.lockmsg{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:600}
.kbtn{margin-left:auto;background:var(--c-soft)!important;border-color:var(--c)!important;color:var(--ink)}
.kbtn+.tbtn{margin-left:0}
.code-slots{display:flex;gap:8px;justify-content:center}
.code-slots span{width:64px;height:64px;border:3px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.code-slots span.on{border-style:solid;border-color:var(--c)}
.code-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.code-pad button{font-size:2.4rem;line-height:1;padding:10px 0;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
.code-pad button:hover{border-color:var(--c)}
.codes{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
.codes td{border-top:1px solid var(--line);padding:4px 6px}
.codes td:last-child{font-size:1.3rem;letter-spacing:4px;white-space:nowrap}
.tbtn{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:800;font-size:.88rem}
.tbtn.on{background:#c2503a;border-color:#c2503a;color:#fff}
.tbanner{background:color-mix(in srgb,#c2503a 12%,var(--card));border:1px solid #c2503a;border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.92rem}
.tbanner b{color:#c2503a}
.topen{width:100%;display:flex;flex-direction:column;gap:4px}
.topen div{display:flex;flex-wrap:wrap;gap:4px 12px}
.topen label{display:flex;align-items:center;gap:4px;font-weight:600}
.tbanner .ghost{padding:6px 12px;font-size:.85rem}
.tdlg{position:fixed;inset:0;z-index:80;background:rgba(10,20,16,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.tdlg-c{background:var(--card);border-radius:18px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.tdlg-c h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0}
.tdlg-c input{font:inherit;font-size:1.2rem;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);letter-spacing:4px}
.tdlg-c .err{color:var(--bad);font-size:.9rem;margin:0;min-height:1.4em}
.tdlg-c .row{display:flex;gap:8px;justify-content:flex-end}
.cover-warn{font-size:3rem;line-height:1}
.note{margin-top:18px;font-size:.88rem;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 14px}

/* ---- 활동 창 ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.55);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.panel{background:var(--card);color:var(--ink);border-radius:20px;width:min(1120px,100%);height:min(780px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.panel.wide{width:min(1400px,100%);height:min(900px,100%)}
.p-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.p-title{font-family:var(--display);font-size:1.4rem;line-height:1.2;flex:1;min-width:0}
.p-title small{font-family:var(--body);font-size:.78rem;color:var(--muted);display:block}
.lv{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lv button{border:0;background:var(--card);padding:7px 12px;font-weight:800;font-size:.9rem}
.lv button[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
.p-x{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:1.2rem;font-weight:800}
.p-hud{padding:7px 16px;font-size:1rem;background:var(--c-soft);min-height:38px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-hud b{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--c)}
.bar{display:inline-block;width:160px;height:12px;border-radius:6px;background:var(--card);overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--c);transition:width .1s}
.arena{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none;touch-action:none}
.arena.scrolly{overflow-y:auto;touch-action:auto}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:color-mix(in srgb,var(--bg) 88%,transparent);z-index:60}
.cover-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 30px;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cover-ic{font-size:3.4rem;line-height:1}
.cover-t{font-family:var(--display);font-size:1.7rem;margin:0}
.cover-d{color:var(--muted);margin:0}
.cover-stars{font-size:2.6rem;letter-spacing:6px;color:var(--line)}
.cover-stars b{color:var(--gold);font-weight:400}
.cover-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cover-btns .primary{font-size:1.1rem;padding:12px 26px}

/* ---- 단계 안내(슬라이드) ---- */
.sl{display:grid;grid-template-columns:1.25fr 1fr;height:100%}
@media (max-width:760px){.sl{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}}
.sl>*{min-width:0}
.sl-art{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:10px;position:relative}
.sl-art svg{max-width:100%;max-height:100%}
.sl-side{background:var(--card);border-left:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sl-count{font-size:.8rem;font-weight:800;color:var(--c)}
.sl-title{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.3;margin:0}
.sl-text{font-size:1.05rem}
.sl-text p{margin:0 0 8px}
.sl-text ul,.sl-text ol{margin:0 0 8px;padding-left:1.3em}
.sl-text li{margin-bottom:6px}
.sl-text .warn{color:var(--bad);font-weight:600}
.sl-need{background:var(--c-soft);border-radius:10px;padding:8px 12px;margin:0;font-size:.95rem}
.sl-btns{display:flex;gap:8px;margin-top:auto}
.sl-btns .primary{flex:1}

/* 그림 공용 색 */
.s-wall{fill:var(--wall)} .s-desk{fill:var(--desk)} .s-desk2{fill:var(--desk2)}
.s-dark{fill:var(--dev)} .s-dark2{fill:var(--dev2)} .s-light{fill:var(--devl)} .s-key{fill:var(--dev2)}
.s-screen{fill:var(--screen)} .s-icon{fill:#ffffff;opacity:.8} .s-bar{fill:var(--dev2);opacity:.6}
.s-led{fill:#47c27d} .s-power{fill:var(--dev)} .s-sym{fill:none;stroke:#cfe9ff;stroke-width:2.4;stroke-linecap:round}
.s-port{fill:#1d262b} .s-vent{fill:none;stroke:var(--dev);stroke-width:3;stroke-linecap:round}
.s-paper{fill:var(--paper);stroke:var(--line)} .s-cone{fill:var(--dev2);stroke:#1d262b;stroke-width:2}
.s-band{fill:none;stroke:var(--dev);stroke-width:10;stroke-linecap:round} .s-mic{fill:none;stroke:var(--dev);stroke-width:4;stroke-linecap:round}
.s-lens{fill:#1d262b;stroke:#7fb3d9;stroke-width:2} .s-usb{fill:#d9573b} .s-metal{fill:#b8c2c8}
.s-cord{fill:none;stroke:var(--dev2);stroke-width:3;opacity:.7}

/* 기기 탐험 */
.parts{display:grid;grid-template-columns:1.6fr 1fr;height:100%}
@media (max-width:760px){.parts{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}}
.parts>*{min-width:0}
.parts-art{display:flex;align-items:center;justify-content:center;padding:12px}
.setup{width:100%;max-height:100%}
.setup .pt{cursor:pointer;transition:opacity .2s}
.setup .pt:hover{filter:brightness(1.12)}
.setup.focus .pt:not(.on){opacity:.28}
.setup .pt.on{filter:drop-shadow(0 0 7px var(--c)) drop-shadow(0 0 2px var(--c))}
.setup .pt.no{animation:shake .35s}
.parts-card{background:var(--card);border-left:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.pc-kind{font-size:.8rem;font-weight:800;color:var(--c);letter-spacing:.04em}
.pc-kind.ok{color:var(--ok);font-size:1rem}
.pc-name{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1.2;margin:0}
.pc-desc{font-size:1.1rem;margin:0}
.pc-more{color:var(--muted);margin:0}
.pc-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:10px}
.pc-nav .primary{flex:1}
.pc-step{font-family:var(--display);color:var(--c);font-size:1.1rem;width:100%}
.pc-tip{font-size:.85rem;color:var(--muted);margin:0}
.quiz-q{font-family:var(--display);font-size:1.7rem;line-height:1.35;margin:4px 0}
.quiz-fb{color:var(--bad);font-weight:600;min-height:1.6em;margin:0}

/* 켜기 그림 */
.mini{width:100%;max-width:520px}
.mon-screen{fill:#1a2126;transition:fill .5s}
.mon-led{fill:#5b6770;cursor:pointer;stroke:var(--c);stroke-width:3}
.pc-btn{fill:var(--dev);cursor:pointer;stroke:var(--c);stroke-width:4}
.pc-led{fill:#5b6770}
.mini.m-on .mon-led{fill:#47c27d;stroke:none}
.mini.p-on .pc-led{fill:#47c27d}
.mini.p-on .pc-btn{stroke:none;fill:#3b7fbf}
.mini.m-on .mon-screen{fill:#232c33}
.mini.booting .mon-screen{fill:#1f3b52}
.boot{opacity:0;fill:#ffffff}
.mini.booting .boot{opacity:1}
@media (prefers-reduced-motion:no-preference){
 .mini.booting .boot circle{animation:blink 1.2s infinite}
 .mini.booting .boot circle:nth-child(2){animation-delay:.15s}.mini.booting .boot circle:nth-child(3){animation-delay:.3s}.mini.booting .boot circle:nth-child(4){animation-delay:.45s}
 .mon-led:not(.got),.pc-btn:not(.got){animation:ring 1.2s infinite}}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes ring{0%,100%{stroke-opacity:1}50%{stroke-opacity:.15}}
.mini:not(.m-on) .pc-btn{stroke:none}
.mini.p-on .mon-led,.mini.m-on.p-on .pc-btn{animation:none}
.fake-pc{width:100%;max-width:520px;aspect-ratio:16/10;border:10px solid var(--dev);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(160deg,#5aa9d6,#2f6fa6)}
.fake-pc.big{max-width:720px}
.fp-screen{flex:1;position:relative;padding:12px}
.fp-icons{display:flex;flex-direction:column;gap:10px;width:70px}
.fp-icons span{display:flex;flex-direction:column;align-items:center;font-size:1.7rem;line-height:1}
.fp-icons i{font-style:normal;font-size:.7rem;color:#fff;margin-top:3px}
.fp-bar{height:38px;background:#e8eef2;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.fp-start{display:grid;grid-template-columns:repeat(2,9px);gap:2px;border:0;background:transparent;padding:8px;border-radius:6px}
button.fp-start{outline:3px solid var(--c);outline-offset:-2px}
.fp-start b{width:9px;height:9px;background:#2b67c9;border-radius:1px}
.fp-time{font-size:.8rem;color:#33424b}
.fp-menu{position:absolute;left:10px;bottom:8px;width:min(300px,80%);background:#f6f8fa;color:#1c2925;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:12px;display:flex;flex-direction:column;gap:10px}
.fp-menu-h{font-weight:800;font-size:.85rem}
.fp-apps{display:flex;gap:10px;font-size:1.6rem}
.fp-pow{align-self:flex-end;border:2px solid var(--c);background:#fff;color:#1c2925;border-radius:8px;width:42px;height:42px;font-size:1.3rem}
.fp-pow-menu{display:flex;flex-direction:column;align-self:flex-end;background:#fff;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);overflow:hidden}
.fp-pow-menu button{border:0;background:#fff;color:#1c2925;padding:9px 18px;text-align:left;font-weight:600}
.fp-pow-menu button:hover{background:#e2ebfa}
.fp-black{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:#7d8a91;font-size:.95rem}
.off{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.off-say{font-family:var(--display);font-size:1.4rem;text-align:center;text-wrap:balance}
.mouse-art{width:100%;max-width:300px}
.m-part{fill:var(--devl);stroke:var(--dev);stroke-width:3}
.mouse-art.parts .m-part{cursor:pointer}
.mouse-art.parts .m-part:not(.got):hover{fill:var(--c-soft)}
.mouse-art .m-part.got{fill:var(--c-soft);stroke:var(--c)}
.m-wheel{fill:var(--dev2)}
.mouse-art .m-wheel.got{fill:var(--c)}
.m-lbl{font-family:var(--display);font-size:20px;text-anchor:middle;fill:var(--ink);opacity:0;pointer-events:none}
.m-lbl.show{opacity:1}
.f{stroke:#ffffff;stroke-width:3}
.f-palm{fill:#f2c49b;opacity:.55;stroke:none}
.f1{fill:#e85d5d}.f2{fill:#4b9fe0}.f3{fill:#f0a531}.f4{fill:#4fbf86}.f5{fill:#a77ae0}
.f-t{font-family:var(--display);font-size:20px;fill:#fff;text-anchor:middle;pointer-events:none}
.fingers{list-style:none;padding:0!important}
.fingers li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d{display:inline-block;width:16px;height:16px;border-radius:50%}
.d1{background:#e85d5d}.d2{background:#4b9fe0}.d3{background:#f0a531}.d4{background:#4fbf86}.d5{background:#a77ae0}.dp{background:#f2c49b}
.tok{display:flex;flex-direction:column;align-items:center;gap:14px}
.tok-btn{width:170px;height:170px;border-radius:50%;border:0;background:#f5c542;color:#4a3a00;font-family:var(--display);font-size:2.4rem;box-shadow:0 8px 0 #c99a1b}
.tok-btn.hit{animation:press .18s}
.tok-n{font-family:var(--display);font-size:1.6rem}
@keyframes press{50%{transform:translateY(6px);box-shadow:0 2px 0 #c99a1b}}

/* ---- 마우스 게임 ---- */
.g-star{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 35%,transparent) 0 60%,transparent 61%);border:3px dashed var(--gold);pointer-events:none}
.g-star.on{background:radial-gradient(circle,color-mix(in srgb,var(--gold) 70%,transparent) 0 60%,transparent 61%);border-style:solid}
.g-balloon{position:absolute;border:0;padding:0;border-radius:50% 50% 47% 47%;background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.75) 0 9%,var(--c) 10%);cursor:pointer}
.g-balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:40%;background:var(--muted);transform:translateX(-50%)}
.g-balloon.pop{transition:transform .2s,opacity .2s;opacity:0;scale:1.5}
.g-holes{display:grid;gap:16px;height:100%;padding:20px;max-width:760px;margin:0 auto;align-content:center}
.g-hole{position:relative;aspect-ratio:1.3;max-height:150px;border:0;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,#3d2a1c 0 45%,#7a5a3c 46% 60%,#9c7a52 61%);overflow:hidden}
.g-ham{position:absolute;left:50%;bottom:-70%;transform:translateX(-50%);font-size:clamp(2.2rem,6vw,4rem);line-height:1;transition:bottom .12s;pointer-events:none}
.g-hole.up .g-ham{bottom:12%}
.g-hole.bonk{animation:shake .3s}
.g-target{position:absolute;border:0;padding:0;border-radius:50%;background:radial-gradient(circle,#e85d5d 0 18%,#fff 19% 36%,#e85d5d 37% 55%,#fff 56% 72%,#e85d5d 73%);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.g-missmark{position:absolute;transform:translate(-50%,-50%);color:var(--bad);font-weight:800;font-size:1.6rem;pointer-events:none}
.g-gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;padding:24px;height:100%;align-content:center;max-width:880px;margin:0 auto}
.g-gifts.small{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
.g-gift{aspect-ratio:1;border:2px solid var(--line);border-radius:18px;background:var(--card);font-size:clamp(2.6rem,7vw,4.2rem);line-height:1}
.g-gifts.small .g-gift{font-size:clamp(2rem,5vw,3rem)}
.g-gift.open{background:var(--c-soft);border-color:var(--c);animation:pop .3s}
.g-lr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,86%);background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.g-lr.is-l{border-color:#4b9fe0}.g-lr.is-r{border-color:#f0a531}
.g-lr.no{animation:shake .35s}
.lr-m{width:110px}
.lr-b{fill:var(--devl);stroke:var(--dev);stroke-width:3}
.lr-b.hot{fill:#4b9fe0}
.is-r .lr-b.hot{fill:#f0a531}
.lr-body{fill:var(--devl);stroke:var(--dev);stroke-width:3}
.lr-t{font-family:var(--display);font-size:2.2rem}
.is-l .lr-t{color:#2f7cc0}.is-r .lr-t{color:#c97a12}
.lr-time{width:100%;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.lr-time i{display:block;height:100%;background:var(--bad)}
.g-baskets{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:14px;padding:0 12px}
.g-basket{flex:1;max-width:240px;height:120px;border:3px dashed var(--c);border-radius:0 0 40px 40px;background:var(--c-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.g-basket.over{border-style:solid;background:color-mix(in srgb,var(--c) 30%,var(--card))}
.g-basket.yum{animation:pop .3s}
.bk-n{font-family:var(--display);font-size:1.8rem;color:var(--c);line-height:1}
.bk-t{font-weight:800}
.g-item{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;cursor:grab;touch-action:none;border-radius:14px}
.g-item.hold{cursor:grabbing;z-index:5;background:color-mix(in srgb,var(--card) 70%,transparent);box-shadow:0 8px 20px rgba(0,0,0,.18);scale:1.15}
.g-sea{position:absolute;inset:0;overflow-y:scroll;touch-action:pan-y;background:linear-gradient(#bfe6f5,#3b8fc2 30%,#1a4f7c 70%,#0d2a47)}
.g-sea-in{position:relative}
.sea-deco{position:absolute;font-size:2.4rem;opacity:.8;pointer-events:none}
.sea-depth{position:absolute;right:10px;font-size:.8rem;font-weight:800;color:rgba(255,255,255,.7);pointer-events:none}
.sea-hint{position:absolute;top:20px;left:0;right:0;text-align:center;font-family:var(--display);font-size:1.5rem;color:#0f3352}
.sea-gem{position:absolute;border:0;background:rgba(255,255,255,.18);border-radius:50%;width:70px;height:70px;font-size:2.4rem;line-height:1;box-shadow:0 0 22px rgba(160,230,255,.9)}
.sea-gem.found{animation:pop .4s;background:var(--gold)}
/* 짝 맞추기 */
.g-mem{display:grid;gap:12px;padding:20px;height:100%;align-content:center;margin:0 auto}
.mem-card{aspect-ratio:3/4;border:0;padding:0;background:transparent;perspective:600px;max-height:150px}
.mem-in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mem-card.up .mem-in{transform:rotateY(180deg)}
.mem-back,.mem-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden}
.mem-back{background:var(--c);color:var(--c-ink);font-family:var(--display);font-size:2.2rem;box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--c-ink) 30%,transparent)}
.mem-face{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg);font-size:clamp(2rem,5vw,3.2rem)}
.mem-card.got .mem-face{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
/* 점 잇기 */
.g-dots{position:absolute;left:50%;top:50%;width:min(86%,calc(100% - 40px));aspect-ratio:1;max-height:calc(100% - 40px);max-width:calc(100vh - 220px);transform:translate(-50%,-50%)}
.dots-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dots-fill{opacity:0;transition:opacity .8s}
.g-dots.finished .dots-fill{opacity:.85}
.dots-line{fill:none;stroke:var(--ink);stroke-width:.8;stroke-linejoin:round;stroke-linecap:round}
.dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--ink);background:var(--card);font-family:var(--display);color:var(--ink);padding:0;line-height:1}
.dot.first{border-color:var(--c);color:var(--c)}
.dot.on{background:var(--ink);color:var(--card)}
.dots-done{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-family:var(--display);font-size:2rem;color:var(--c)}
/* 색칠하기 */
.g-color{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px;align-items:center}
.col-svg{flex:1;min-height:0;width:100%;max-width:820px}
.reg{fill:#ffffff;stroke:#333;stroke-width:1.6;cursor:pointer}
.reg.pre{cursor:default}
.reg text{fill:#333;stroke:none;font-family:var(--display);font-size:15px;text-anchor:middle;pointer-events:none}
.reg.done text{opacity:0}
.reg:not(.pre):not(.done):hover{fill:#fff7cc}
.reg.shake{animation:regshake .35s}
@keyframes regshake{30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.col-pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sw{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-weight:800}
.sw i{width:26px;height:26px;border-radius:50%;background:var(--sw);border:1px solid rgba(0,0,0,.25)}
.sw span{font-size:.8rem;color:var(--muted);font-weight:600}
.sw.on{border-color:var(--c);box-shadow:0 0 0 3px var(--c-soft);transform:translateY(-2px)}
/* 퍼즐 */
.pz-board{position:absolute;border:3px dashed var(--line);border-radius:6px;background-size:100% 100%;background-repeat:no-repeat}
.pz-board.ghost{opacity:1}
.pz-board.ghost::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.78}
.pz-board.lines{background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px)!important;background-size:var(--pw) var(--ph)!important}
.pz-board.full{border-color:var(--ok)}
.pz-piece{position:absolute;background-repeat:no-repeat;box-shadow:0 3px 10px rgba(0,0,0,.25);border:2px solid #fff;border-radius:4px;cursor:grab;touch-action:none}
.pz-piece.hold{cursor:grabbing;box-shadow:0 12px 26px rgba(0,0,0,.3);z-index:5}
.pz-piece.lock{box-shadow:none;border-color:transparent;cursor:default;border-radius:0}
/* 모양 맞추기 */
.sh-hole{position:absolute}
.sh-hole svg{width:100%;height:100%;fill:var(--soft);stroke:var(--muted);stroke-width:3;stroke-dasharray:7 5}
.sh-hole.full svg{stroke:var(--ok)}
.sh-piece{position:absolute;cursor:grab;touch-action:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.sh-piece svg{width:100%;height:100%;stroke:rgba(0,0,0,.25);stroke-width:2}
.sh-piece.hold{cursor:grabbing;z-index:5;scale:1.08}
.sh-piece.lock{cursor:default;filter:none}
/* 얼굴 꾸미기 */
.g-face{display:grid;grid-template-columns:1fr 300px;height:100%}
@media (max-width:760px){.g-face{grid-template-columns:1fr;grid-template-rows:1fr auto}}
.fc-stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fc-head{width:min(72%,420px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#ffd25e 60%,#f0b93a);box-shadow:0 10px 30px rgba(0,0,0,.15)}
.fc-tray{background:var(--card);border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.fc-h{font-weight:800;color:var(--muted);font-size:.9rem}
.fc-items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;flex:1;min-height:0;align-content:start}
.fc-pick{border:1px solid var(--line);border-radius:12px;height:72px;display:flex;align-items:center;justify-content:center;cursor:grab;overflow:hidden;background:var(--bg);touch-action:none}
.fc-pick .fc-part{transform:scale(.62);pointer-events:none}
.fc-part{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;cursor:grab;touch-action:none}
.fc-pick .fc-part{position:static}
.fc-part svg{width:100%;height:100%}
.fc-part.hold{z-index:30;cursor:grabbing;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.fc-btns{display:flex;gap:8px}
.fc-btns .primary{flex:1}

/* ---- 1단계 윈도우: 공통 배치 ---- */
.simwrap{display:grid;grid-template-columns:300px 1fr;height:100%}
@media (max-width:860px){.simwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.simwrap>*{min-width:0}
.task{background:var(--card);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;transition:background .3s}
.task.good{background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.tk-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;color:var(--c);font-size:.9rem}
.tk-h b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.tk-dots{display:flex;gap:3px}
.tk-dots span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.tk-dots span.on{background:var(--c)}
.tk-dots span.cur{background:var(--c);opacity:.45}
.tk-t{font-family:var(--display);font-size:1.38rem;line-height:1.45;margin:0;text-wrap:pretty}
.tk-ok{font-family:var(--display);font-size:1.5rem;color:var(--ok)}
.tk-hint{align-self:flex-start;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:6px 12px;font-weight:800;font-size:.92rem}
.tk-ht{margin:0;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
.tk-intro{margin:0;font-size:1rem}
.tk-foot{margin-top:auto;padding-top:6px}
.tk-foot .ghost{font-size:.85rem;padding:6px 12px}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.98rem;line-height:1.45}
.goals li i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff}
.goals li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.goals li.ok i{background:var(--ok);border-color:var(--ok)}
.simhost,.tour-sim{position:relative;min-height:0;padding:10px;background:#cfd8de}
.tour{display:grid;grid-template-columns:1fr 320px;height:100%}
@media (max-width:860px){.tour{grid-template-columns:1fr;grid-template-rows:1fr auto}}
.tour>*{min-width:0}
.tour-card{background:var(--card);border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.tc-n{font-size:.8rem;font-weight:800;color:var(--c)}
.tc-t{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.2;margin:0}
.tc-d{font-size:1.08rem;margin:0}
.tc-m{color:var(--muted);margin:0}
.tc-btns{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.tc-btns .primary{flex:1}
.tc-tip{font-size:.82rem;color:var(--muted);margin:0}
.tour-layer{position:absolute;inset:0;pointer-events:none;z-index:40}
.spot{position:absolute;pointer-events:auto;border:3px solid #ff7a1a;border-radius:10px;background:rgba(255,122,26,.08);padding:0}
.spot span{position:absolute;left:-12px;top:-12px;width:26px;height:26px;border-radius:50%;background:#ff7a1a;color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.spot.seen{border-color:#3fa66b;background:transparent}
.spot.seen span{background:#3fa66b}
.spot.on{border-color:#ff3b6b;background:rgba(255,59,107,.14);box-shadow:0 0 0 4px rgba(255,59,107,.25)}
.spot.on span{background:#ff3b6b}
@media (prefers-reduced-motion:no-preference){.spot:not(.seen):not(.on){animation:spotpulse 1.4s infinite}}
@keyframes spotpulse{50%{box-shadow:0 0 0 6px rgba(255,122,26,.25)}}

/* ---- 연습용 윈도우 (일부러 Windows 11 밝은 모양으로 고정) ---- */
.ws{position:relative;width:100%;height:100%;overflow:hidden;border-radius:8px;font-family:'Malgun Gothic','Apple SD Gothic Neo',var(--body);font-size:14px;color:#1b1b1b;background:radial-gradient(ellipse at 70% 120%,#2f7fd6 0,#0f4fa8 45%,#0a2f6e 100%);user-select:none;-webkit-user-select:none;line-height:1.35;color-scheme:light}
.ws.frozen *{pointer-events:none!important}
.ws button{font-family:inherit;color:#1b1b1b}
.ws-desk{position:absolute;left:0;top:0;right:0;bottom:46px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,100px);grid-auto-columns:94px;gap:2px;padding:8px;align-content:start;justify-content:start}
.it{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px;border-radius:5px;border:1px solid transparent;cursor:default;text-align:center;position:relative}
.ws-desk .it{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.it:hover{background:rgba(255,255,255,.14)}
.w-files .it:hover{background:#e5f1fb}
.it.sel{background:rgba(160,205,255,.42);border-color:rgba(200,225,255,.85)}
.w-files .it.sel{background:#cce4f7;border-color:#99c9ef}
.it.cut{opacity:.45}
.it.dragging{opacity:.5}
.it.drop,.w-nav button.drop{background:#cce4f7!important;border-color:#1f6fd1!important;outline:2px solid #1f6fd1}
.it-ic{font-size:38px;line-height:1.1;position:relative}
.it-ic.thumb{background:#fff;border:1px solid #c9d2d8;border-radius:3px;padding:4px 7px;font-size:31px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.it-n{font-size:13px;line-height:1.25;max-width:88px;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-ren{width:84px;font:inherit;font-size:12px;border:1px solid #1f6fd1;padding:1px 3px;text-align:center;outline:none;color:#1b1b1b;background:#fff;user-select:text;-webkit-user-select:text}
.bin-badge{position:absolute;right:-8px;top:-4px;background:#e3443a;color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:0 5px;text-shadow:none;line-height:16px}
.empty-note{grid-column:1/-1;color:#777;padding:14px;font-size:12.5px}
.ws-wins{position:absolute;left:0;top:0;right:0;bottom:46px;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:#fff;border:1px solid #9aa7b0;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;min-width:220px}
.win.front{border-color:#5f87b0}
.win.max{border-radius:0;border:0}
.w-title{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding-left:10px;background:#eef2f6;cursor:default}
.win.front .w-title{background:#dfe9f5}
.w-ic{font-size:15px}
.w-tt{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-btns{display:flex;height:100%}
.w-btns button{width:44px;height:100%;border:0;background:transparent;font-size:13px}
.w-btns button:hover{background:rgba(0,0,0,.08)}
.w-btns button.x:hover{background:#c42b1c;color:#fff}
.w-grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#9aa7b0 50%,#9aa7b0 58%,transparent 58%,transparent 70%,#9aa7b0 70%,#9aa7b0 78%,transparent 78%)}
.win.max .w-grip{display:none}
.w-tool{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid #e3e7ea;flex:none;flex-wrap:wrap;background:#f9fbfc}
.w-tool button{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:transparent;border-radius:5px;padding:3px 7px;min-width:46px}
.w-tool button b{font-size:18px;line-height:1.1;font-weight:400}
.w-tool button i{font-style:normal;font-size:11.5px;color:#444}
.w-tool button:hover:not(:disabled){background:#e5ecf2}
.w-tool button.wide{flex-direction:row;font-size:12px;padding:6px 10px;border:1px solid #cfd8de;margin-left:4px}
.w-tool .sep{width:1px;height:28px;background:#dde3e7;margin:0 4px}
.w-tool .bin-tools{display:flex;align-items:center}
.w-addr{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid #e3e7ea;flex:none}
.w-addr>button{width:28px;height:26px;border:0;background:transparent;border-radius:5px;font-size:14px}
.w-addr>button:hover:not(:disabled){background:#e5ecf2}
